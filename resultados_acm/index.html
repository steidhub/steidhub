<style>
:root{--ink:#111;--ink2:#4A423C;--muted:#8a7f72;--tan:#C46B3C;--hl:#F3E1D3;--line:#E3D6C8;--grid:#EDE3D8;--panel:#FAF6F0;--panel2:#EDE5DC;--bg:#F6EFE8;--ok:#2e7d4f;--bad:#b4442c;--s1:#7A8B7A;--s2:#C46B3C;--s3:#8B6F5A;--sans:"Poppins",Arial,sans-serif;--serif:Georgia,serif}
*{box-sizing:border-box}html,body{margin:0}body{font:14px/1.5 var(--sans);color:var(--ink);background:var(--bg);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
em{font-family:var(--serif);font-style:italic;font-weight:400;color:var(--tan)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.18em;font-size:11px;text-transform:uppercase}.brand i{width:10px;height:10px;border-radius:50%;background:var(--tan)}
.lg{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.lgc{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:28px 24px}
.lgc h1{font-size:22px;margin:18px 0 4px;letter-spacing:-.02em}.lgc p{margin:0 0 18px;color:var(--ink2);font-size:13px}
label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:12px 0 5px}
input{width:100%;font:15px var(--sans);padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);-webkit-user-select:text;user-select:text}input:focus{outline:2px solid var(--tan);outline-offset:-1px}
.btn{width:100%;margin-top:18px;border:0;border-radius:99px;background:var(--ink);color:var(--hl);font:700 14px var(--sans);padding:13px;cursor:pointer}.err{color:var(--bad);font-size:13px;margin-top:12px;min-height:18px}
.wrap{max-width:1000px;margin:0 auto;padding:16px 16px 40px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0 12px;border-bottom:1.5px solid var(--ink);flex-wrap:wrap}.pill{border:1px solid var(--line);border-radius:99px;padding:3px 11px;font-size:11px;font-weight:600;color:var(--ink2);background:var(--panel)}
.eb{color:var(--tan);font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;margin-top:20px}h1.t{font-weight:800;font-size:clamp(22px,5vw,32px);letter-spacing:-.02em;line-height:1.12;margin:6px 0}.sub{color:var(--ink2);margin:0}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0;padding:12px 14px;background:var(--panel2);border-radius:12px;font-size:13px}.l{display:block;font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.kpis{display:grid;grid-template-columns:1.3fr 1.3fr 1fr 1fr;gap:10px}@media(max-width:760px){.kpis{grid-template-columns:1fr 1fr}.kpis .k:first-child{grid-column:1/-1}}
.k{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--panel)}.k.hl{background:var(--ink);color:var(--hl);border-color:var(--ink)}.k.hl .l{color:#cbbfae}.k .v{font-size:clamp(19px,4.6vw,25px);font-weight:800;letter-spacing:-.02em;margin:2px 0}.k .v.sm{font-size:clamp(14px,3.6vw,17px)}.k .h{font-size:11px;color:var(--muted)}.k.hl .h{color:#cbbfae}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}.card h2{font-size:15px;margin:0 0 10px}
.ver{margin-top:10px;border-left:3px solid;background:var(--panel2);border-radius:10px;padding:10px 13px;font-size:13px}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--tan);-webkit-user-select:none}.mg{display:flex;align-items:center;gap:12px;margin-top:12px;font-size:12.5px}.mg input{flex:1}.mg b{min-width:38px}
#map{height:340px;border-radius:12px;overflow:hidden}.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:760px){.g2{grid-template-columns:1fr}#map{height:290px}}
.ch svg{width:100%;height:auto;display:block}.sc{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:760px}th{text-align:left;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:7px 8px;border-bottom:1.5px solid var(--ink);white-space:nowrap}td{padding:10px 8px;border-bottom:1px solid var(--grid);white-space:nowrap}td.w{white-space:normal;min-width:200px}td.r,th.r{text-align:right}.s{color:var(--muted);font-size:11px;white-space:normal}
.tg{display:inline-block;color:#fff;border-radius:99px;padding:2px 8px;font-size:10px;font-weight:600}td a{color:var(--tan);font-weight:600;text-decoration:none}.conc{margin:0;padding-left:18px;line-height:1.6;color:var(--ink2)}.conc li{margin-bottom:6px}.conc b{color:var(--ink)}
.sig{display:flex;flex-direction:column;align-items:center;text-align:center;margin:26px 0 8px}.sig img{width:120px;opacity:.85}.sig div{font-size:11.5px;color:var(--ink2);border-top:1px solid var(--line);padding-top:6px;min-width:230px}.sig b{color:var(--ink);font-size:12.5px}
.foot{background:var(--ink);color:var(--hl);border-radius:16px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:18px}.foot .reg{font-size:10.5px;color:#d9ccbb;margin-top:4px;max-width:520px}.foot .tel{font-size:19px;font-weight:800;white-space:nowrap}.foot a{color:var(--hl);text-decoration:none;font-weight:600}
.wm{position:fixed;inset:0;pointer-events:none;z-index:50;opacity:.028;font:800 13px var(--sans);letter-spacing:.3em;overflow:hidden}.wm span{position:absolute;white-space:nowrap;transform:rotate(-24deg)}
.dl{border:0;border-radius:99px;background:var(--tan);color:#fff;font:700 12px var(--sans);padding:6px 14px;cursor:pointer;margin-left:4px}.dl:disabled{opacity:.6}
.mk{width:24px;height:24px;border-radius:50%;color:#fff;font-weight:700;font-size:11px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 4px #0004}.mk.me{background:#111;width:30px;height:30px;font-size:15px}
@media(max-width:760px){.kpis .k:first-child{text-align:center;padding:16px 14px}.kpis .k:first-child .v{font-size:30px}.foot{flex-direction:column;align-items:center;text-align:center;padding:20px 16px;gap:14px}.foot>div{width:100%;text-align:center!important}.foot .brand{justify-content:center}.foot .reg{margin:8px auto 0;max-width:none}.foot .tel{font-size:22px}.wrap{padding:12px 14px 32px}}
[hidden]{display:none!important}@media print{body>*:not(#pf){display:none!important}body:after{content:"Informe de uso exclusivo en pantalla";display:block;padding:40px;font:16px sans-serif}}
